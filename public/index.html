<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看 Agent 的调用轨迹、上下文处理和诊断结果。">
  <title>Agent 执行工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <div class="product"><span class="product-mark" aria-hidden="true">↳</span><span>Agent 工作台</span></div>
      <div class="topbar-actions">
        <a id="open-tasks" class="button" href="/tasks">测试需求</a>
        <button id="open-upload" class="button primary" type="button">上传 Agent</button>
      </div>
    </div>
  </header>
  <main class="page">
    <section class="page-title">
      <div><h1>Agent 测试工作台</h1></div>
      <div class="history-controls">
        <label for="run-picker">运行记录</label>
        <select id="run-picker" aria-label="选择运行记录" disabled></select>
        <button id="open-compare" class="button" type="button" disabled>对比版本</button>
      </div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="empty-state" class="empty-state">
      <h2>还没有运行记录</h2>
      <p>上传 Agent 并通过预检后，可以在这里查看调用链。</p>
      <button id="upload-first" class="button primary" type="button">上传 Agent</button>
    </section>

    <section id="workspace" class="workspace" aria-label="运行详情" hidden>
      <header class="run-header">
        <div class="run-heading"><span id="phase" class="badge"></span><div><h2 id="run-label"></h2><p id="run-meta" class="muted mono"></p></div></div>
        <dl id="metrics" class="metrics"></dl>
      </header>
      <div id="run-findings" class="run-findings" hidden></div>
      <div class="workspace-toolbar">
        <div class="tabs" id="views" role="group" aria-label="运行视图">
          <button type="button" data-view="batch" aria-pressed="false" hidden>批次总览</button>
          <button type="button" data-view="trace" aria-pressed="true">调用链</button>
          <button type="button" data-view="requirement" aria-pressed="false">测试需求</button>
          <button type="button" data-view="output" aria-pressed="false">最终产出</button>
          <button type="button" data-view="analysis" aria-pressed="false">分析 Agent</button>
        </div>
        <div class="run-actions">
          <button id="run-retest" class="button small" type="button" hidden>用修改版复测</button>
          <button id="compare-retest" class="button small" type="button" hidden>与原运行对比</button>
          <button id="stop-batch" class="button small" type="button" hidden>当前题结束后停止</button>
          <a id="trace-export" href="#" class="text-link" hidden>导出轨迹</a>
        </div>
      </div>
      <div id="trace-view" class="trace-layout">
        <section id="call-graph" class="graph-panel" aria-label="交互式调用链图">
          <header class="graph-toolbar">
            <div class="graph-heading">
              <button id="graph-back" class="button small" type="button" hidden>全局</button>
              <div><h3 id="graph-title">轮次总览</h3><p id="graph-count" class="muted mono"></p></div>
            </div>
            <div class="graph-search-controls">
              <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索步骤或消息" aria-label="搜索步骤或消息" maxlength="130"></label>
              <button id="only-issues" class="button small" aria-pressed="false" type="button">高亮异常</button>
            </div>
          </header>
          <div id="graph-results" class="graph-results" hidden>
            <p id="graph-result-count" class="muted" role="status"></p>
            <div class="graph-result-buttons">
              <button id="graph-prev-result" class="button small" type="button" aria-label="上一处匹配">↑</button>
              <button id="graph-next-result" class="button small" type="button" aria-label="下一处匹配">↓</button>
            </div>
          </div>
          <div class="graph-viewport" tabindex="0" aria-label="调用链画布。滚轮纵向浏览，方向键平移，加号和减号缩放。" data-graph-viewport>
            <canvas class="graph-edges" data-graph-edges aria-hidden="true"></canvas>
            <div class="graph-stage" data-graph-stage></div>
            <p class="graph-empty muted" data-graph-empty>等待运行步骤…</p>
          </div>
          <footer class="graph-footer">
            <div class="graph-navigation" role="group" aria-label="调用图缩放">
              <button class="button small" type="button" data-graph-zoom="-1" aria-label="缩小">−</button>
              <span class="muted mono graph-scale" data-graph-scale>100%</span>
              <button class="button small" type="button" data-graph-zoom="1" aria-label="放大">+</button>
              <button class="button small" type="button" data-graph-fit>适应画布</button>
            </div>
            <button class="graph-minimap" type="button" data-graph-minimap aria-label="总览小地图。点击移动视图。">
              <canvas width="126" height="40" aria-hidden="true"></canvas>
            </button>
          </footer>
        </section>
        <aside class="step-inspection" aria-label="所选步骤" aria-busy="false">
          <section id="diagnostics" class="diagnostics" aria-label="步骤诊断"></section>
        </aside>
        <section id="code-review" class="code-review" aria-labelledby="code-review-title" hidden></section>
        <details id="step-data" class="step-data" hidden>
          <summary>步骤数据 <span id="step-data-caption" class="muted"></span></summary>
          <section id="inspector" class="inspector" aria-label="步骤数据"></section>
        </details>
      </div>
      <div id="batch-view" class="batch-view" hidden></div>
      <div id="requirement-view" class="requirement-view" hidden></div>
      <div id="output-view" class="output-view" hidden></div>
      <div id="analysis-view" class="analysis-view" hidden></div>
    </section>
  </main>

  <dialog id="upload-dialog" aria-labelledby="upload-title">
    <form id="upload-form">
      <div class="dialog-heading"><h2 id="upload-title">上传 Agent</h2><button class="button icon" type="button" data-close="upload-dialog" aria-label="关闭">×</button></div>
      <p id="upload-status" class="muted"></p>
      <p id="retest-target" class="notice" hidden></p>
      <label class="form-field">程序包<input id="agent-file" name="agent" type="file" accept=".py,.zip" required></label>
      <label class="form-field">版本名称<input name="version" type="text" placeholder="选填，例如 保留强制规则" maxlength="70"></label>
      <div class="dialog-actions"><a class="text-link" href="/sample-agent.py" download>下载接入示例</a>
        <button id="upload-check" class="button" type="button" disabled>安全预检</button></div>
      <section id="preflight-report" class="preflight-report" aria-live="polite" hidden></section>
      <fieldset id="upload-tasks" class="upload-tasks" hidden>
        <legend>选择测试任务</legend>
        <label class="form-field">任务来源<select id="upload-task-source">
          <option value="local">本地需求</option><option value="benchmark">官方 Benchmark</option>
        </select></label>
        <div id="upload-task-options" class="upload-task-options"></div>
        <div id="upload-benchmark-picker" hidden></div>
      </fieldset>
      <label id="analysis-field" class="form-field" hidden>分析范围
        <select name="analysisMode">
          <option value="full">全量逐步诊断</option>
          <option value="failed">仅诊断未通过和执行失败的题目</option>
          <option value="score">仅评分和规则检查</option>
        </select>
      </label>
      <p id="analysis-scope" class="muted" role="status" hidden></p>
      <div class="dialog-actions upload-run-actions"><button id="upload-submit" class="button primary" type="submit" disabled>开始本地运行</button></div>
      <p id="upload-error" class="issue" role="alert"></p>
    </form>
  </dialog>
  <dialog id="compare-dialog" class="compare-dialog" aria-labelledby="compare-title">
    <div class="dialog-heading"><h2 id="compare-title">版本对比</h2><button class="button icon" type="button" data-close="compare-dialog" aria-label="关闭">×</button></div>
    <div class="comparison-selects">
      <label class="form-field">原运行<select id="compare-a"></select></label>
      <label class="form-field">复测运行<select id="compare-b"></select></label>
    </div>
    <div id="compare-body" aria-live="polite"></div>
  </dialog>
</body>
</html>
